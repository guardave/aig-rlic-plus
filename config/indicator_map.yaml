# the active universe. The build script will mark these as
# status="archived_deprecated" so they appear on the Status tab with a
# clear "deprecated" badge instead of being hidden.
# ─────────────────────────────────────────────────────────────────────────
deprecated_pair_ids:
  - sofr_us3m_spy        # was sofr_ted_spy; archived 2026-06-02 (trade_return_pct=0)
  - sofr_us3m_xlp        # same
  - tedrate_spy          # was ted_spliced_spy / dff_ted_spy; archived 2026-06-02
  - tedrate_xlp          # same
