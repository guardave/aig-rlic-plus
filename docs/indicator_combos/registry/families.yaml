# Hypothesis families, revision 3 (2026-10-17). DRAFT until the user approves and the hash is recorded.
#
# Counting rule: every hypothesis object in hypotheses.yaml is ONE pre-specified configuration with ONE primary
# endpoint; grid variants, assets, horizons and variant thresholds are separate hypotheses.
# Correction scope: the family's hypotheses evaluated on the SAME dataset. Confirmatory hypotheses
# (discovery-informed prospective confirmations) are evaluated on V-C / V-S; exploratory ones on historical data.
# method is one of: romano_wolf | holm | hansen_spa | deflated_sharpe | single_test | none.
# "none" is allowed only where the family has no hypotheses of that kind (checked by the gate, rule R15).

families:
  F-REC:
    name: Recession classification (real-time)
    n_total: 7
    n_confirmatory: 4
    correction_confirmatory:
      method: holm
      detail: >-
        Holm over the 4 confirmatory hypotheses (D1-02.H1, D1-27.H1-H3) at FWER 0.05, using the exact McNemar
        p-value (D1-02.H1) and the block-bootstrap Diebold-Mariano p-value on Brier differences (D1-27).
    correction_exploratory:
      method: holm
      detail: Holm over all 7 hypotheses on the historical LORO evaluation (reported, no claims).
  F-TC:
    name: Term spread x credit spread
    n_total: 4
    n_confirmatory: 1
    correction_confirmatory:
      method: single_test
      detail: One confirmatory hypothesis (D1-05.H1); HAC (Newey-West lag 6) and stationary-bootstrap p both <= 0.05.
    correction_exploratory:
      method: romano_wolf
      detail: Romano-Wolf stepdown (stationary bootstrap, mean block 6, 2000 draws) over all 4 hypotheses on V-A and V-B.
  F-FCI:
    name: Point-in-time financial-conditions index
    n_total: 2
    n_confirmatory: 2
    correction_confirmatory:
      method: romano_wolf
      detail: Romano-Wolf stepdown (stationary bootstrap, mean block 6, 2000 draws) over the 2 hypotheses.
    correction_exploratory:
      method: romano_wolf
      detail: Same procedure on V-A / V-B (supporting).
  F-RISKOFF:
    name: Risk-off confirmation and credit-to-activity chains
    n_total: 8
    n_confirmatory: 2
    correction_confirmatory:
      method: romano_wolf
      detail: Romano-Wolf stepdown over the 2 confirmatory D1-01 hypotheses.
    correction_exploratory:
      method: romano_wolf
      detail: Romano-Wolf over all 8 hypotheses on V-A.
  F-STATE:
    name: State dependence of macro signals (signal x regime interactions)
    n_total: 6
    n_confirmatory: 0
    correction_confirmatory:
      method: none
      detail: No confirmatory hypothesis since revision 3 (the 80th-percentile regime cut is a convention).
    correction_exploratory:
      method: romano_wolf
      detail: Romano-Wolf stepdown (stationary bootstrap, 2000 draws) over all 6 hypotheses on V-A.
  F-REENTRY:
    name: Re-entry timing after risk-off
    n_total: 1
    n_confirmatory: 0
    correction_confirmatory:
      method: none
      detail: No confirmatory hypothesis since revision 3 (vote thresholds are conventions).
    correction_exploratory:
      method: single_test
      detail: One hypothesis; episode-level exact sign test.
  F-COMP:
    name: Block-representative composites, weighting, sizing and updating
    n_total: 20
    n_confirmatory: 0
    correction_confirmatory:
      method: none
      detail: No confirmatory hypothesis.
    correction_exploratory:
      method: romano_wolf
      detail: >-
        Romano-Wolf stepdown over all 20 hypotheses on V-A; Hansen SPA for "best of family beats B2a"; deflated
        Sharpe with N = configurations actually fitted inside D1-10 / D1-29.
  F-SECT:
    name: Sector rotation and relative returns
    n_total: 8
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: No confirmatory hypothesis.}
    correction_exploratory:
      method: romano_wolf
      detail: Romano-Wolf over all 8 hypotheses on V-A (total-return series required, G17).
  F-HOUS:
    name: Housing block redundancy and composites
    n_total: 14
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: No confirmatory hypothesis.}
    correction_exploratory: {method: romano_wolf, detail: Romano-Wolf over all 14 hypotheses on V-A.}
  F-DIV:
    name: Soft vs hard data divergence
    n_total: 2
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: No confirmatory hypothesis.}
    correction_exploratory: {method: romano_wolf, detail: Romano-Wolf over 2 hypotheses on V-A.}
  F-FLEET:
    name: Frozen fleet winners (diffusion, cheap family, return-stream dependence)
    n_total: 3
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: No confirmatory hypothesis.}
    correction_exploratory: {method: holm, detail: "N3 re-selection null mandatory; Holm over 3 hypotheses."}
  F-REV:
    name: Revision and alignment robustness (reported for every finalist, selects nothing)
    n_total: 0
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: Descriptive only.}
    correction_exploratory: {method: none, detail: Descriptive only.}
  F-SPACE:
    name: Size and dimensionality of the combination space; power budget
    n_total: 1
    n_confirmatory: 0
    correction_confirmatory: {method: none, detail: No confirmatory hypothesis.}
    correction_exploratory: {method: single_test, detail: "One hypothesis (D2-04) with a block-bootstrap interval."}
