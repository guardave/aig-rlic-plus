# Machine-readable question / hypothesis ledger, revision 3 (2026-10-17).
# Source of truth for COMPLIANCE.md and registry/compliance.csv. Schema: registry/schema.json. Gate:
# scripts/gate_combo_registry.py (pre-commit on this branch, reads the STAGED files; bypassed by `git commit
# --no-verify` and inactive unless `git config core.hooksPath scripts/hooks`). DRAFT until the user approves and
# the hash is recorded.
#
# Hypothesis status (a field on every hypothesis, never inferred):
#   confirmatory = a DISCOVERY-INFORMED PROSPECTIVE CONFIRMATION: the designer had seen post-1997 history and the
#                  fleet's single-indicator results, so the design is not snooping-free; the protection is that
#                  the verdict is read only on data nobody had seen at freeze time (V-C forward, V-S sequestered).
#                  Every rule parameter must be "citation" (a published source fixes it) or "natural" (zero /
#                  sign threshold, year-over-year change, level, equal weights, expanding window, published rule).
#   exploratory  = anything else; historical evidence only; reaches V-C only through a new registration.
# Parameter source_type: citation | natural | convention (round number chosen by us) | data_chosen.
# Pass-rule margins (e.g. "CVaR down >= 15%") are decision thresholds, not rule parameters; they are fixed here.
# Member tracks: vintage (ALFRED file must exist), market (unrevised; gate whitelist), snapshot_forward,
# revised (today's values delayed to release date: NOT point-in-time), label, derived, fleet.

templates:
  bl_u1: &bl_u1
    B1: "yes: buy-and-hold of the target"
    B2a: "yes: best single member, chosen on the training folds by the same procedure"
    B3: "yes: equal-weight expanding-z composite of the members, prior signs, threshold 0"
    B4: "yes: 10-month SMA overlay (Faber 2007)"
  bl_u2: &bl_u2
    B1: "yes: static weight equal to the strategy's average exposure"
    B2a: "yes: best single member on the training folds"
    B3: "yes: equal-weight composite"
    B4: "yes: 10% volatility target"
  bl_u3: &bl_u3
    B1: "yes: equal-weight 9 sectors"
    B2a: "yes: best single member on the training folds"
    B3: "yes: equal-weight composite"
    B4: "yes: 12-month relative momentum"
  bl_u4: &bl_u4
    B1: "yes: constant base-rate classifier"
    B2a: "yes: best single member on the training folds"
    B3: "yes: equal-weight z composite mapped to a flag (> 0) or a one-parameter probit"
    B4: "yes: S&P 500 below its 10-month SMA as a recession flag (needs G5 before 1993)"
  bl_na: &bl_na
    B1: "n/a: descriptive estimate, no strategy claim"
    B2a: "n/a: descriptive estimate, no strategy claim"
    B3: "n/a: descriptive estimate, no strategy claim"
    B4: "n/a: descriptive estimate, no strategy claim"
  cvar1: &cvar1
    type: cvar_overlay
    statistic: relative reduction in monthly CVaR(5%) of the overlay vs each comparator
    comparator: B2a and B3 (intersection-union)
    params: {return_horizon_months: 1}
  pr_cvar: &pr_cvar
    margin: 0.15
    margin_unit: relative CVaR reduction vs both comparators
    test: stationary_bootstrap
    alpha: 0.05
    guardrail: annualised return shortfall vs B1 <= 2.0 pp
  ev_dd: &ev_dd
    min_events: 3
    event_def: distinct target drawdowns >= 15% (monthly closes) in the evaluation window; fewer = inconclusive
  inter1: &inter1
    type: interaction
    statistic: d in r(t+1) = a + b*s(t) + c*g(t) + d*s(t)*g(t), monthly excess return
    comparator: additive model
    params: {return_horizon_months: 1}
  pr_inter: &pr_inter
    margin: 0.50
    margin_unit: pp per month, registered sign
    test: hac_and_stationary_bootstrap
    alpha: 0.05
    guardrail: a fold with no regime episode contributes to a and b only
  ev_reg: &ev_reg
    min_events: 5
    event_def: distinct regime episodes (runs separated by >= 3 months)

questions:
# ===================================================================== F-REC
- id: D1-02
  direction: 1
  family: F-REC
  status: confirmatory
  title: Does requiring a prior curve inversion cut the false alarms of a labour trigger?
  use_case: U4
  members:
    curve: {series: T10Y3M, track: market, role: "inverted (< 0) at any month-end in the last 12 months"}
    sahm: {series: UNRATE, track: vintage, role: "Sahm gap (3m avg minus min of prior 12 months' 3m avg)"}
    nber: {series: NBER, track: label, role: recession label (ex post)}
  baselines: *bl_u4
  null_design: N1 joint panel shift (episode-preserving); N2 random labour-style member
  validation: {primary: "V-S; V-C", supporting: "LORO over historical recessions (V-A + V-B, frozen)", descriptive: "V-D (2020)"}
  uses_fleet_winners: false
  influenced_by: [none]
  provenance:
    label: discovery-informed prospective confirmation
    designer_knowledge: Designed 2026-10-17 knowing post-1980 US recessions and the curve and Sahm literature; no project return series was read for this question.
    frozen: "2026-10-17 (rev3)"
  feasibility: "M: historical LORO has 3 usable recessions (1990, 2001, 2008) until G13 adds 1969-1982"
  priority: P1
  rank: 6
  hypotheses:
  - hid: D1-02.H1
    status: confirmatory
    family: F-REC
    asset: NBER recession months
    members: [curve, sahm, nber]
    rule: "curve inverted in the last 12 months AND Sahm gap >= 0.50 pp"
    parameters:
    - {name: curve_threshold_pp, value: 0.0, source_type: citation, source: "Estrella & Mishkin (1998); Estrella & Trubin (2006): 10y-3m inversion"}
    - {name: curve_lookback_months, value: 12, source_type: citation, source: "Estrella & Mishkin (1998): 4-quarter forecast horizon"}
    - {name: sahm_threshold_pp, value: 0.50, source_type: citation, source: "Sahm (2019)"}
    endpoint:
      type: lexicographic_recession
      statistic: "L1 recall; L2 false-alarm episodes; L3 median signal date vs NBER peak"
      comparator: curve alone
      params: {recall_window_pre_peak_months: 12, recall_window_post_peak_months: 6}
    label_horizon_months: 12
    purge_months: 12
    pass_rule:
      margin: 0.5
      margin_unit: "L2: false-alarm episodes reduced by >= 50% vs curve alone"
      test: exact_mcnemar
      alpha: 0.05
      guardrail: "L1: no held-out recession missed that the comparator caught and Clopper-Pearson 95% lower bound of recall >= 0.5; L3: median signal <= NBER peak + 6 months"
    min_events: 6
    event_def: recessions (V-S >= 8 country-recessions) plus discordant false-alarm episodes >= 5; fewer = inconclusive
  - hid: D1-02.H2
    status: exploratory
    family: F-REC
    asset: NBER recession months
    members: [curve, sahm, nber]
    rule: "curve inverted in the last 12 months AND Sahm gap >= 0.30 pp (labelled variant)"
    parameters:
    - {name: curve_threshold_pp, value: 0.0, source_type: citation, source: "Estrella & Mishkin (1998)"}
    - {name: curve_lookback_months, value: 12, source_type: citation, source: "Estrella & Mishkin (1998)"}
    - {name: sahm_threshold_pp, value: 0.30, source_type: convention, source: "our lower trigger; the published rule is 0.50"}
    endpoint:
      type: lexicographic_recession
      statistic: "L3 median signal date vs NBER peak, subject to L1 and L2 non-inferiority"
      comparator: Sahm rule at 0.50 pp alone
      params: {recall_window_pre_peak_months: 12, recall_window_post_peak_months: 6, comparator_sahm_threshold_pp: 0.50}
    label_horizon_months: 12
    purge_months: 12
    pass_rule:
      margin: 2
      margin_unit: "months earlier (median) than the 0.50 rule"
      test: exact_sign_test
      alpha: 0.05
      guardrail: "L1 recall non-inferior; L2 false alarms <= comparator (exact McNemar not rejecting at 0.05)"
    min_events: 6
    event_def: recessions with all members observable in real time for 24 months before the peak
