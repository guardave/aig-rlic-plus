# Machine-readable question / hypothesis ledger (rev2, 2026-10-17). Source of truth for COMPLIANCE.md and for
# the per-question fields in QUESTION_BANK.md. Validated by docs/indicator_combos/scripts/gate_combo_registry.py
# (pre-commit, whenever docs/indicator_combos/ is staged). DRAFT until the user approves and the hash is recorded.
#
# status:  confirmatory  = verdict decided ONLY on V-C (frozen forward) and/or V-S (sequestered international);
#                          members strictly point-in-time (ALFRED vintages, unrevised market data, or prospective
#                          snapshots); textbook rules with no parameter chosen from data; not shaped by the viewed
#                          OOS, by full-sample correlations or by turning-point diagnostics.
#          exploratory   = historical evidence only (V-A, V-B supporting; V-D descriptive); generates hypotheses
#                          for a later, separate registration.
#          descriptive   = an estimate with an interval; selects nothing.
# tracks:  vintage (ALFRED real-time), market (unrevised), revised (today's values delayed to release date; NOT
#          point-in-time), snapshot_forward (no-archive source, point-in-time only from the 2026-10 snapshots),
#          label (ex-post NBER dates), derived (built from other members), fleet (published fleet winner rule).
# Validation codes and baseline / null codes: QUESTION_BANK.md section 0.

templates:
  u1: &u1
    primary_endpoint: Relative reduction in monthly CVaR(5%) of the overlay vs each comparator (B2a and B3)
    pass_rule: >-
      CVaR reduction >= 15% vs BOTH B2a and B3 (intersection-union), family-adjusted one-sided p <= 0.05
      (stationary block bootstrap, mean block 6, 2000 draws); guardrail: annualised return shortfall vs B1 <= 2.0 pp
    min_events: 3
    event_def: distinct SPY drawdowns >= 15% (monthly closes) inside the evaluation window; fewer = inconclusive
  u4lex: &u4lex
    primary_endpoint: >-
      Lexicographic, episode-level: L1 recall (held-out recessions flagged between NBER peak - 12 m and peak + 6 m);
      L2 false-alarm episodes per decade; L3 median signal date relative to the NBER peak
    pass_rule: >-
      L1 recall non-inferior to the comparator (no held-out recession missed that the comparator caught); L2
      false-alarm episodes per decade <= comparator + 0.0; L3 median signal >= 2 months earlier than the comparator.
      All three required; exact (Clopper-Pearson) intervals reported for recall
    min_events: 6
    event_def: >-
      recessions with every member observable in real time for the 24 months before the peak, 2020 excluded (V-D);
      V-S needs >= 8 country-recessions; fewer = inconclusive
  interaction: &interaction
    primary_endpoint: >-
      Interaction coefficient d in r(t+1) = a + b*s(t) + c*g(t) + d*s(t)*g(t), s = signal (+1 bull / -1 bear),
      g = regime dummy; monthly SPY excess return
    pass_rule: >-
      d has the registered sign, |d| >= 0.50 pp per month, HAC (Newey-West lag 6) p <= 0.05 AND stationary-bootstrap
      p <= 0.05 (family-adjusted); a fold with no regime episode contributes to a, b only
    min_events: 5
    event_def: distinct regime episodes (runs of g = 1 separated by >= 3 months) in the evaluation window

