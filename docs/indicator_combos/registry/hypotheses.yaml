- id: D1-27
  direction: 1
  family: F-REC
  status: confirmatory
  title: Real-time recession-probability horse race (Codex Q1)
  use_case: U4
  members:
    term: {series: T10Y3M, track: market, role: "core predictor (GS10 - TB3MS monthly before 1982)"}
    credit: {series: HY_IG_OAS, track: market, role: "added predictor (Moody's Baa - Aaa before 1997)"}
    sahm: {series: UNRATE, track: vintage, role: added predictor (Sahm gap, continuous)}
    permit: {series: PERMIT, track: vintage, role: added predictor (YoY)}
    nber: {series: NBER, track: label, role: recession within 12 months}
  baselines: *bl_u4
  null_design: N1 joint panel shift; N2 random added predictor
  validation: {primary: "V-S; V-C", supporting: "LORO over historical recessions (expanding fits, frozen)", descriptive: "V-D"}
  uses_fleet_winners: false
  influenced_by: [none]
  provenance:
    label: discovery-informed prospective confirmation
    designer_knowledge: "Predictor set from the literature (term: Estrella & Mishkin 1998; credit: Gilchrist & Zakrajsek 2012; labour: Sahm 2019; housing: Leamer 2007); the credit-proxy splice at 1997 is a data-availability choice, disclosed"
    frozen: "2026-10-17 (rev3)"
  feasibility: "M: G13, G14, G16 widen the event count"
  priority: P1
  rank: 2
  hypotheses:
  - hid: D1-27.H1
    status: confirmatory
    family: F-REC
    asset: NBER recession within 12 months
    members: [term, credit, nber]
    rule: expanding-window probit, term + credit
    parameters: &d127p
    - {name: forecast_horizon_months, value: 12, source_type: citation, source: "Estrella & Mishkin (1998)"}
    - {name: predictors_in_levels, value: 1, source_type: natural, source: levels / YoY / published Sahm gap, no thresholds}
    - {name: estimation_window, value: expanding, source_type: natural, source: expanding real-time estimation}
    endpoint: &d127e
      type: brier_skill
      statistic: Brier skill score vs the term-spread-only probit
      comparator: term-only probit
      params: {forecast_horizon_months: 12}
    label_horizon_months: 12
    purge_months: 12
    pass_rule: &d127r
      margin: 0.10
      margin_unit: Brier skill score
      test: diebold_mariano_block_bootstrap
      alpha: 0.05
      guardrail: "log score better in >= 70% of held-out recessions; reliability slope in [0.7, 1.3]"
    min_events: 6
    event_def: recessions in the evaluation data (V-S >= 8)
  - hid: D1-27.H2
    status: confirmatory
    family: F-REC
    asset: NBER recession within 12 months
    members: [term, sahm, nber]
    rule: expanding-window probit, term + Sahm gap
    parameters: *d127p
    endpoint: *d127e
    label_horizon_months: 12
    purge_months: 12
    pass_rule: *d127r
    min_events: 6
    event_def: recessions in the evaluation data (V-S >= 8)
  - hid: D1-27.H3
    status: confirmatory
    family: F-REC
    asset: NBER recession within 12 months
    members: [term, credit, sahm, permit, nber]
    rule: expanding-window probit, term + credit + Sahm gap + permits YoY
    parameters: *d127p
    endpoint: *d127e
    label_horizon_months: 12
    purge_months: 12
    pass_rule: *d127r
    min_events: 6
    event_def: recessions in the evaluation data (V-S >= 8)
